<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  G-code converter</title>
    <link rel="icon" href="image copy.png">
</head>
<body>
    <input type="text" id="textInput" value="Type here your text!">
    <button id="reloadButton">Reload</button>
    <label for="">Charachter scale</label>
    <input type="number" id="scaleInput" value="1" step="0.5">
    <label for="">Space between charachters (mm)</label>
    <input type="number" id="spaceInput" value="10" step="5">
    <br>
    <label for="" >Start Position X</label>
    <input type="number" value="100" id="startPosX"  step="10">
    <label for="">Start Position Y</label>
    <input type="number" id="startPosY" value="100" step="10">
    <label for="">Calibrate at start</label>
    <input type="checkbox" id="calibrateCheckBox">
    <label for="">X</label>
    <input type="checkbox" id="calibrateX" checked style="display: none;">
    <label for="">Y</label>
    <input type="checkbox" id="calibrateY" checked style="display: none;">
    <label for="">Z</label>
    <input type="checkbox" id="calibrateZ" checked style="display: none;">



    <label for="">Auto Copy</label>
    <input type="checkbox" id="autoCopy">
    <br>
    <p>This is very buggy. The actual G-code below works fine</p>
    <canvas  width="600px" height="600px" style="border:1px solid grey" id="canvas"></canvas>
    <button id="copyButton"> Copy G-code</button>
    <p id="output"></p>
    <script src="script.js"></script>
</body>
</html>
